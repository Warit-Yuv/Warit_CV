name: Build CVs

on:
  push:
    paths:
      - "**.tex"
      - "resume.cls"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            Warit_CV.tex
            Resume.tex
          latexmk_use_lualatex: false

      - name: Compress PDFs (300 DPI)
        run: |
          sudo apt-get update || echo "::warning::apt-get update had non-fatal mirror issues, continuing with install..."
          sudo apt-get install -y ghostscript
          for pdf in Warit_CV.pdf Resume.pdf; do
            if [ -f "$pdf" ]; then
              gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/printer \
                 -dNOPAUSE -dQUIET -dBATCH \
                 -sOutputFile="${pdf}.tmp" "$pdf"
              mv "${pdf}.tmp" "$pdf"
            fi
          done

      - name: Generate preview images
        run: |
          sudo apt-get install -y poppler-utils
          mkdir -p assets
          # Clean old previews
          rm -f assets/Warit_CV_p*.png assets/Resume_p*.png assets/*_preview*
          # Convert all pages and rename with mv
          pdftoppm -png -r 150 Warit_CV.pdf assets/Warit_CV_preview
          pdftoppm -png -r 150 Resume.pdf assets/Resume_preview
          for f in assets/*_preview-*.png; do
            [ -e "$f" ] || continue
            mv "$f" "${f//_preview-/_p}"
          done
          ls -lh assets/

      - name: Commit updated PDFs and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Warit_CV.pdf Resume.pdf assets/ || true
          git diff --cached --quiet || (git commit -m "Auto-build: update CV PDFs and previews [skip ci]" && git push)
